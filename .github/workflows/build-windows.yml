name: Build Windows Installers

on:
  workflow_dispatch:
  push:
    branches: [main, 'fix/**', 'feature/**']
    paths:
      - '**.js'
      - 'renderer/**'
      - 'assets/**'
      - 'package*.json'
      - '.github/workflows/build-windows.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Verify and build Windows x64
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Check lockfile exists
        shell: pwsh
        run: |
          if (-not (Test-Path package-lock.json)) { throw 'package-lock.json 缺失，无法 npm ci' }
      - name: Install dependencies
        run: npm ci
      - name: Check syntax, assets and package targets
        run: npm run check
      - name: Test cancellation and desktop coordinates
        run: npm test
      - name: Test Electron with a temporary desktop
        run: npm run test:smoke
      - name: Test first-run setup and saved preferences
        run: npm run test:setup
      - name: Test display changes and safe cancellation
        run: npm run test:displays
      - name: Build NSIS and portable without publishing
        run: npx electron-builder --win --x64 --publish never
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: clawd-pig-windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clawd-pig-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
